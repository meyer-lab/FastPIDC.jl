name: Python CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "python/**"
      - ".github/workflows/python-CI.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-CI.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: "."
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
        # Julia-cross-validation and CUDA-backend tests skip themselves when
        # julia / a GPU aren't available; the FastPIDC.jl project above is
        # instantiated so those tests actually run (rather than erroring)
        # on runners that ship a preinstalled julia, e.g. ubuntu-latest.
