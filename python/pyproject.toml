[project]
name = "fastpidc"
version = "0.1.0"
description = "Information-theoretic network inference (MI, CLR, PUC, PIDC) - Python port of FastPIDC.jl"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Meyer Lab" }]
dependencies = ["numpy>=1.24", "scipy>=1.11", "h5py>=3.9"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=12.0"]

[project.scripts]
fastpidc = "fastpidc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastpidc"]
artifacts = ["src/fastpidc/kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "julia: cross-validates against a freshly run FastPIDC.jl (requires julia on PATH)",
    "largemem: allocates >8 GiB of GPU memory to exercise flat indices past 2^31 (deselected by default; run with -m largemem on an idle GPU)",
]
addopts = "-m 'not largemem'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
